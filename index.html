<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网站</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f3f4f6; color: #222;
      text-align: center; padding-top: 70px; margin: 0;
    }
    h1 { color: #185FA5; }
    .card {
      background: white; max-width: 500px;
      margin: 30px auto; padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    button {
      background: #185FA5; color: white; border: none;
      padding: 10px 20px; border-radius: 8px;
      cursor: pointer; font-size: 15px;
    }
  </style>
</head>
<body>
  <h1>你好，世界！</h1>
  <div class="card">
    <p>这是我的第一个网站，用 GitHub Pages 免费上线。</p>
    <button onclick="document.getElementById('msg').innerText='你点到我啦！'">
      点我一下
    </button>
    <p id="msg"></p>
  </div>
</body>
</html>
